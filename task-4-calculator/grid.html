<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="grid.css" rel="stylesheet">
</head>
<body>
    <main class="calculator">
        <header class="calculator__header">
            <p class="calculator__logo">calc</p>

            <fieldset class="theme-switcher">
                <legend class="theme-switcher__legend">Theme</legend>
                <div class="theme-switcher__track">
                    <span class="theme-switcher__thumb" aria-hidden="true"></span>
                    <label class="theme-switcher__option">
                        <input type="radio" name="theme" id="theme-1" value="1" checked>
                        <span>1</span>
                    </label>
                    <label class="theme-switcher__option">
                        <input type="radio" name="theme" id="theme-2" value="2">
                        <span>2</span>
                    </label>
                    <label class="theme-switcher__option">
                        <input type="radio" name="theme" id="theme-3" value="3">
                        <span>3</span>
                    </label>
                </div>
            </fieldset>
        </header>

        <output class="calculator__display" for="theme-1 theme-2 theme-3">0</output>

        <section class="keypad" aria-label="Calculator keys">
            <button type="button" class="key key--light" data-action="number">7</button>
            <button type="button" class="key key--light" data-action="number">8</button>
            <button type="button" class="key key--light" data-action="number">9</button>
            <button type="button" class="key key--blue" data-action="delete">DEL</button>

            <button type="button" class="key key--light" data-action="number">4</button>
            <button type="button" class="key key--light" data-action="number">5</button>
            <button type="button" class="key key--light" data-action="number">6</button>
            <button type="button" class="key key--light" data-action="operator" data-operator="+" aria-label="add">+</button>

            <button type="button" class="key key--light" data-action="number">1</button>
            <button type="button" class="key key--light" data-action="number">2</button>
            <button type="button" class="key key--light" data-action="number">3</button>
            <button type="button" class="key key--light" data-action="operator" data-operator="-" aria-label="subtract">&minus;</button>

            <button type="button" class="key key--light" data-action="decimal">.</button>
            <button type="button" class="key key--light" data-action="number">0</button>
            <button type="button" class="key key--light" data-action="operator" data-operator="/" aria-label="divide">/</button>
            <button type="button" class="key key--light" data-action="operator" data-operator="*" aria-label="multiply">x</button>

            <button type="button" class="key key--blue key--reset" data-action="clear">RESET</button>
            <button type="button" class="key key--red key--equals" data-action="equals">=</button>
        </section>
    </main>

    <script src="calculator.js" defer></script>
</body>
</html>
