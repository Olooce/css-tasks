<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
</head>
<body>
    <div class="page">
        <aside class="sidebar">
            <div class="sidebar__top">
                <div class="logo">
                    <img class="logo__mark" src="logo-mark.png" alt="">
                    <span class="logo__text">bng</span>
                </div>
            </div>
            <div class="sidebar__footer">
                <p class="sidebar__copyright">© All Rights Reserved</p>
            </div>
        </aside>
        <div class="hero"></div>
    </div>

    <main class="login-card">
        <header class="login-card__header">
            <div class="login-card__icon">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </div>
            <h1 class="login-card__title">User Login</h1>
        </header>

        <form class="login-card__body">
            <p class="login-card__hint">Enter your username and password</p>

            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="field__input-wrap">
                    <input id="password" name="password" type="password" autocomplete="current-password">
                    <button type="button" class="field__toggle" aria-label="Show password" aria-pressed="false">
                        <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="login-card__actions">
                <button type="submit" class="btn-signin">Sign In</button>
            </div>
        </form>

        <div class="login-card__footer"></div>
    </main>

    <script>
        const toggle = document.querySelector('.field__toggle');
        const password = document.getElementById('password');
        const icon = toggle.querySelector('i');

        toggle.addEventListener('click', () => {
            const isHidden = password.type === 'password';
            password.type = isHidden ? 'text' : 'password';
            toggle.setAttribute('aria-pressed', String(isHidden));
            toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            icon.classList.toggle('fa-eye-slash', !isHidden);
            icon.classList.toggle('fa-eye', isHidden);
        });
    </script>
</body>
</html>
